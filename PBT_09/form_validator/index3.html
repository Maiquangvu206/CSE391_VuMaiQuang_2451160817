<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validator</title>
    <link rel="stylesheet" href="style3.css" />
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>Đăng ký tài khoản</h1>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Tên</label>
                    <div class="input-row">
                        <input id="name" type="text" placeholder="Nhập tên của bạn" />
                        <span id="nameStatus" class="status neutral">•</span>
                    </div>
                    <small id="nameError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="example@gmail.com" />
                    <small id="emailError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Nhập mật khẩu" />

                    <div class="strength-wrap">
                        <div class="strength-bar">
                            <div id="strengthFill" class="strength-fill"></div>
                        </div>
                        <span id="strengthText" class="strength-text">Chưa nhập</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu" />
                    <small id="confirmError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input id="phone" type="text" inputmode="numeric" placeholder="0901-234-567" maxlength="12" />
                    <small id="phoneError" class="error"></small>
                </div>

                <button id="submitBtn" type="submit" disabled>Đăng ký</button>
            </form>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <h2>Đăng ký thành công!</h2>
            <div id="modalContent" class="modal-content"></div>
            <button id="closeModalBtn" type="button">Đóng</button>
        </div>
    </div>

    <script src="app3.js"></script>
</body>
</html>
